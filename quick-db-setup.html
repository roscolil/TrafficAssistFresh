<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Database Setup</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .button {
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    .button:hover {
      background: #0056b3;
    }

    .log {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
    }

    .status {
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>

<body>
  <h1>🚀 Quick Database Setup</h1>
  <p>This will create the essential tables using direct SQL execution</p>

  <div>
    <button class="button" onclick="setupBasicTables()">Setup Basic Tables</button>
    <button class="button" onclick="checkTables()">Check Tables</button>
    <button class="button" onclick="clearLog()">Clear Log</button>
  </div>

  <div id="status"></div>
  <div id="log" class="log"></div>

  <script>
    const API_URL = 'https://traffic-assist-api-dev-axoirfzmzq-uc.a.run.app';

    function log(message) {
      const logEl = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      logEl.textContent += `[${timestamp}] ${message}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').textContent = '';
    }

    function showStatus(message, type = 'info') {
      const statusEl = document.getElementById('status');
      statusEl.innerHTML = `<div class="status ${type}">${message}</div>`;
    }

    async function executeSQL(sql, description) {
      try {
        log(`Executing: ${description}`);

        // Use the detections endpoint to execute SQL (temporary hack)
        const response = await fetch(`${API_URL}/api/detections`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sql_command: sql,
            device_id: 'admin-setup',
            location: { lat: 0, lng: 0 },
            confidence: 1.0,
            timestamp: new Date().toISOString()
          })
        });

        log(`SQL executed: ${description}`);
        return true;
      } catch (error) {
        log(`Error: ${error.message}`);
        return false;
      }
    }

    async function setupBasicTables() {
      showStatus('Setting up basic database tables...', 'info');
      log('Starting basic table setup...');

      const sqlCommands = [
        {
          sql: `CREATE EXTENSION IF NOT EXISTS "uuid-ossp";`,
          desc: 'Enable UUID extension'
        },
        {
          sql: `CREATE EXTENSION IF NOT EXISTS "postgis";`,
          desc: 'Enable PostGIS extension'
        },
        {
          sql: `CREATE TABLE IF NOT EXISTS devices (
                        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
                        platform VARCHAR(50),
                        model VARCHAR(255),
                        created_at TIMESTAMP DEFAULT NOW()
                    );`,
          desc: 'Create devices table'
        },
        {
          sql: `CREATE TABLE IF NOT EXISTS detections (
                        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
                        device_id UUID,
                        location_lat FLOAT,
                        location_lng FLOAT,
                        confidence FLOAT,
                        traffic_light_state VARCHAR(50),
                        timestamp TIMESTAMP,
                        created_at TIMESTAMP DEFAULT NOW()
                    );`,
          desc: 'Create detections table'
        }
      ];

      let successCount = 0;
      for (const cmd of sqlCommands) {
        const success = await executeSQL(cmd.sql, cmd.desc);
        if (success) successCount++;
        await new Promise(resolve => setTimeout(resolve, 500)); // Small delay
      }

      if (successCount === sqlCommands.length) {
        showStatus('✅ Basic tables created successfully!', 'success');
        log('Setup complete!');
      } else {
        showStatus('⚠️ Some commands may have failed', 'error');
      }
    }

    async function checkTables() {
      try {
        log('Checking database status...');
        const response = await fetch(`${API_URL}/api/status`);
        const data = await response.json();

        log('Database connection: ' + data.services?.database?.status);
        showStatus(`Database Status: ${data.services?.database?.status}`,
          data.services?.database?.status === 'connected' ? 'success' : 'error');
      } catch (error) {
        log(`Status check failed: ${error.message}`);
        showStatus('Status check failed', 'error');
      }
    }
  </script>
</body>

</html>
